<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Musamali & Associates Advocates — Legal representation, strategic advocacy and practical legal solutions in Kenya.">

<title>Musamali & Associates Advocates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --black: #080808;
    --dark: #111111;
    --charcoal: #181818;

    --cream: #f4f2ed;
    --warm: #e9e6de;
    --white: #ffffff;

    --grey: #77736b;
    --light-grey: #aaa69d;

    --line-dark: rgba(255,255,255,.14);
    --line-light: rgba(0,0,0,.13);

    --serif: "Playfair Display", Georgia, serif;
    --sans: "DM Sans", Arial, sans-serif;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--cream);
    color: var(--black);

    font-family: var(--sans);

    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

img {
    max-width: 100%;
    display: block;
}

::selection {
    background: #111;
    color: #fff;
}


/* =========================================================
   GLOBAL
========================================================= */

.container {
    width: min(1400px, 86vw);
    margin: auto;
}

.kicker {
    display: flex;
    align-items: center;
    gap: 14px;

    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .18em;
}

.kicker::before {
    content: "";

    width: 45px;
    height: 1px;

    background: currentColor;
}

.serif {
    font-family: var(--serif);
}

.muted {
    color: var(--grey);
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 82px;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5vw;

    color: white;

    transition:
        background .5s ease,
        color .5s ease,
        height .5s ease,
        border .5s ease;
}

.nav.scrolled {
    height: 68px;

    color: var(--black);

    background: rgba(244,242,237,.92);

    backdrop-filter: blur(18px);

    border-bottom: 1px solid var(--line-light);
}

.brand {
    display: flex;
    align-items: center;

    gap: 13px;
}

.brand-mark {
    width: 39px;
    height: 39px;

    border: 1px solid currentColor;

    display: grid;
    place-items: center;

    font-family: var(--serif);

    font-size: 13px;
}

.brand-name {
    font-size: 10px;
    font-weight: 600;

    line-height: 1.4;

    letter-spacing: .11em;

    text-transform: uppercase;
}

.nav-links {
    display: flex;
    align-items: center;

    gap: 32px;
}

.nav-links a {
    position: relative;

    font-size: 10px;

    letter-spacing: .13em;

    text-transform: uppercase;
}

.nav-links a:not(.nav-contact)::after {
    content: "";

    position: absolute;

    bottom: -7px;
    left: 0;

    width: 0;
    height: 1px;

    background: currentColor;

    transition: width .3s ease;
}

.nav-links a:not(.nav-contact):hover::after {
    width: 100%;
}

.nav-contact {
    border: 1px solid currentColor;

    padding: 12px 20px;

    transition: .3s ease;
}

.nav-contact:hover {
    background: white;
    color: black;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    height: 100vh;
    min-height: 720px;

    color: white;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.78) 0%,
            rgba(0,0,0,.48) 48%,
            rgba(0,0,0,.18) 100%
        ),
        url("https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=2400&q=90")
        center / cover;
}

.hero::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.75),
            transparent 55%
        );
}

.hero-content {
    position: absolute;

    left: 7vw;
    bottom: 9vh;

    z-index: 2;
}

.hero-kicker {
    margin-bottom: 30px;

    opacity: .8;
}

.hero-title {
    max-width: 1250px;

    font-family: var(--serif);

    font-size: clamp(
        4.8rem,
        10vw,
        10.5rem
    );

    font-weight: 400;

    line-height: .82;

    letter-spacing: -.065em;
}

.hero-title span {
    display: block;
}

.hero-meta {
    margin-top: 55px;

    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    width: min(1000px, 70vw);
}

.hero-description {
    max-width: 430px;

    font-size: 14px;

    line-height: 1.75;

    color: rgba(255,255,255,.7);
}

.hero-action {
    display: flex;

    align-items: center;

    gap: 18px;

    padding-bottom: 10px;

    border-bottom: 1px solid rgba(255,255,255,.55);

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .15em;
}

.hero-action span {
    font-size: 18px;

    transition: transform .3s ease;
}

.hero-action:hover span {
    transform: translateX(7px);
}

.hero-scroll {
    position: absolute;

    right: 5vw;
    bottom: 8vh;

    z-index: 3;

    writing-mode: vertical-rl;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .2em;

    opacity: .5;
}


/* =========================================================
   SECTION 02 — STATEMENT
========================================================= */

.statement {
    min-height: 100vh;

    padding: 15vh 7vw;

    background: var(--cream);

    display: flex;

    align-items: center;
}

.statement-grid {
    width: 100%;

    display: grid;

    grid-template-columns: .8fr 1.7fr;

    gap: 10vw;
}

.statement-title {
    font-family: var(--serif);

    font-size: clamp(
        3.5rem,
        7vw,
        8rem
    );

    font-weight: 400;

    line-height: .88;

    letter-spacing: -.06em;
}

.statement-title em {
    color: #858078;
}

.statement-copy {
    align-self: center;

    max-width: 700px;
}

.statement-copy p {
    font-size: clamp(
        1.2rem,
        2vw,
        1.75rem
    );

    line-height: 1.65;

    color: #3e3b36;
}

.statement-copy p + p {
    margin-top: 35px;

    font-size: 14px;

    line-height: 1.8;

    color: var(--grey);
}

.statement-number {
    margin-bottom: 35px;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .18em;

    color: var(--grey);
}


/* =========================================================
   SECTION 03 — DARK BRAND STATEMENT
========================================================= */

.dark-statement {
    min-height: 85vh;

    padding: 12vh 7vw;

    background: var(--black);

    color: white;

    display: flex;

    align-items: center;
}

.dark-grid {
    width: 100%;

    display: grid;

    grid-template-columns: 1fr 2fr;

    gap: 10vw;

    align-items: center;
}

.dark-small {
    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .18em;

    color: rgba(255,255,255,.45);
}

.dark-title {
    max-width: 1000px;

    font-family: var(--serif);

    font-size: clamp(
        4rem,
        8vw,
        9rem
    );

    font-weight: 400;

    line-height: .87;

    letter-spacing: -.06em;
}

.dark-title em {
    color: #656565;
}


/* =========================================================
   SECTION 04 — PRACTICE
========================================================= */

.practice {
    background: var(--warm);

    padding: 15vh 7vw;
}

.practice-head {
    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    margin-bottom: 90px;
}

.practice-head h2 {
    font-family: var(--serif);

    font-size: clamp(
        4rem,
        7vw,
        8rem
    );

    font-weight: 400;

    line-height: .84;

    letter-spacing: -.065em;
}

.practice-head p {
    width: 310px;

    font-size: 13px;

    line-height: 1.75;

    color: var(--grey);
}

.practice-list {
    border-top: 1px solid var(--line-light);
}

.practice-item {
    position: relative;

    min-height: 145px;

    display: grid;

    grid-template-columns: 90px 1fr 80px;

    align-items: center;

    border-bottom: 1px solid var(--line-light);

    transition:
        padding .45s ease,
        background .45s ease;
}

.practice-item:hover {
    padding-left: 30px;
    padding-right: 30px;

    background: rgba(255,255,255,.45);
}

.practice-index {
    font-size: 10px;

    color: var(--grey);
}

.practice-name {
    font-family: var(--serif);

    font-size: clamp(
        2rem,
        3.2vw,
        3.4rem
    );

    font-weight: 400;

    transition: transform .45s ease;
}

.practice-item:hover .practice-name {
    transform: translateX(10px);
}

.practice-arrow {
    justify-self: end;

    width: 45px;
    height: 45px;

    border: 1px solid var(--line-light);

    border-radius: 50%;

    display: grid;
    place-items: center;

    font-size: 17px;

    transition:
        background .35s ease,
        color .35s ease,
        transform .35s ease;
}

.practice-item:hover .practice-arrow {
    background: var(--black);

    color: white;

    transform: rotate(-45deg);
}


/* =========================================================
   SECTION 05 — IMAGE
========================================================= */

.visual {
    position: relative;

    height: 100vh;
    min-height: 700px;

    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,.22),
            rgba(0,0,0,.65)
        ),
        url("https://images.unsplash.com/photo-1589994965851-a8f479c573a9?auto=format&fit=crop&w=2400&q=90")
        center / cover;

    display: flex;

    align-items: flex-end;
}

.visual-content {
    width: 100%;

    padding: 0 7vw 10vh;
}

.visual-title {
    max-width: 1100px;

    font-family: var(--serif);

    font-size: clamp(
        4rem,
        8vw,
        9rem
    );

    font-weight: 400;

    line-height: .86;

    letter-spacing: -.065em;
}

.visual-bottom {
    margin-top: 40px;

    display: flex;

    justify-content: space-between;

    align-items: flex-end;
}

.visual-caption {
    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .18em;

    opacity: .6;
}

.visual-copy {
    max-width: 360px;

    font-size: 13px;

    line-height: 1.7;

    color: rgba(255,255,255,.65);
}


/* =========================================================
   SECTION 06 — APPROACH
========================================================= */

.approach {
    min-height: 100vh;

    padding: 15vh 7vw;

    background: var(--cream);
}

.approach-header {
    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    margin-bottom: 100px;
}

.approach-header h2 {
    font-family: var(--serif);

    font-size: clamp(
        4rem,
        7vw,
        8rem
    );

    font-weight: 400;

    line-height: .84;

    letter-spacing: -.065em;
}

.approach-header p {
    max-width: 350px;

    font-size: 13px;

    line-height: 1.75;

    color: var(--grey);
}

.approach-steps {
    border-top: 1px solid var(--line-light);
}

.step {
    min-height: 180px;

    display: grid;

    grid-template-columns: 100px 1fr 1fr;

    gap: 40px;

    align-items: center;

    border-bottom: 1px solid var(--line-light);
}

.step-number {
    font-size: 10px;

    color: var(--grey);
}

.step-title {
    font-family: var(--serif);

    font-size: clamp(
        2rem,
        3vw,
        3rem
    );

    font-weight: 400;
}

.step-text {
    max-width: 450px;

    font-size: 13px;

    line-height: 1.8;

    color: var(--grey);
}


/* =========================================================
   SECTION 07 — WHY
========================================================= */

.why {
    min-height: 90vh;

    padding: 15vh 7vw;

    background: var(--black);

    color: white;
}

.why-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10vw;
}

.why-title {
    font-family: var(--serif);

    font-size: clamp(
        4rem,
        7vw,
        8rem
    );

    font-weight: 400;

    line-height: .85;

    letter-spacing: -.06em;
}

.why-title em {
    color: #666;
}

.why-copy {
    padding-top: 10px;
}

.why-intro {
    max-width: 550px;

    font-size: 1.35rem;

    line-height: 1.7;

    color: rgba(255,255,255,.7);

    margin-bottom: 70px;
}

.principle {
    display: grid;

    grid-template-columns: 55px 1fr;

    padding: 28px 0;

    border-top: 1px solid var(--line-dark);
}

.principle-number {
    font-size: 10px;

    color: #666;
}

.principle h3 {
    margin-bottom: 10px;

    font-size: 15px;
}

.principle p {
    max-width: 470px;

    font-size: 13px;

    line-height: 1.7;

    color: #777;
}


/* =========================================================
   SECTION 08 — LEGAL THINKING
========================================================= */

.insights {
    padding: 15vh 7vw;

    background: var(--warm);
}

.insights-head {
    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    margin-bottom: 90px;
}

.insights-head h2 {
    font-family: var(--serif);

    font-size: clamp(
        4rem,
        7vw,
        8rem
    );

    font-weight: 400;

    line-height: .84;

    letter-spacing: -.065em;
}

.insights-head p {
    max-width: 350px;

    font-size: 13px;

    line-height: 1.75;

    color: var(--grey);
}

.insight-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;
}

.insight-card {
    min-height: 430px;

    padding: 35px;

    background: var(--cream);

    border: 1px solid rgba(0,0,0,.08);

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    transition:
        transform .45s ease,
        background .45s ease;
}

.insight-card:hover {
    transform: translateY(-10px);

    background: white;
}

.insight-number {
    font-size: 10px;

    color: var(--grey);

    letter-spacing: .15em;
}

.insight-title {
    font-family: var(--serif);

    font-size: 2rem;

    line-height: 1.05;
}

.insight-description {
    margin-top: 25px;

    font-size: 12px;

    line-height: 1.7;

    color: var(--grey);
}

.insight-link {
    margin-top: 35px;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .16em;
}


/* =========================================================
   SECTION 09 — CONTACT
========================================================= */

.contact {
    min-height: 100vh;

    padding: 12vh 7vw;

    background: #111;

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}

.contact-top {
    display: flex;

    justify-content: space-between;
}

.contact-label {
    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .18em;

    color: rgba(255,255,255,.45);
}

.contact-title {
    max-width: 1150px;

    font-family: var(--serif);

    font-size: clamp(
        4.5rem,
        9vw,
        10rem
    );

    font-weight: 400;

    line-height: .84;

    letter-spacing: -.065em;
}

.contact-title em {
    color: #666;
}

.contact-bottom {
    display: flex;

    align-items: flex-end;

    justify-content: space-between;
}

.call-button {
    display: inline-flex;

    align-items: center;

    gap: 30px;

    padding: 22px 30px;

    border: 1px solid rgba(255,255,255,.4);

    text-transform: uppercase;

    font-size: 10px;

    letter-spacing: .15em;

    transition:
        background .35s ease,
        color .35s ease;
}

.call-button:hover {
    background: white;

    color: #111;
}

.call-button span {
    font-size: 19px;
}

.contact-details {
    text-align: right;

    font-size: 12px;

    line-height: 1.9;

    color: rgba(255,255,255,.5);
}

.contact-phone {
    display: inline-block;

    margin-top: 5px;

    color: white;

    font-size: 15px;
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    padding: 70px 7vw 35px;

    background: #111;

    color: white;

    border-top: 1px solid rgba(255,255,255,.12);
}

.footer-main {
    display: grid;

    grid-template-columns:
        2fr
        1fr
        1fr
        1fr;

    gap: 50px;

    padding-bottom: 70px;
}

.footer-brand {
    font-family: var(--serif);

    font-size: 2rem;
}

.footer-description {
    max-width: 300px;

    margin-top: 25px;

    font-size: 12px;

    line-height: 1.7;

    color: #666;
}

.footer-column-title {
    margin-bottom: 20px;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .16em;

    color: #666;
}

.footer-column a {
    display: block;

    margin-bottom: 12px;

    font-size: 12px;

    color: #aaa;

    transition: color .25s ease;
}

.footer-column a:hover {
    color: white;
}

.footer-bottom {
    padding-top: 25px;

    border-top: 1px solid rgba(255,255,255,.1);

    display: flex;

    justify-content: space-between;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .12em;

    color: #555;
}


/* =========================================================
   REVEAL ANIMATIONS
========================================================= */

.reveal {
    opacity: 0;

    transform: translateY(45px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.reveal.visible {
    opacity: 1;

    transform: translateY(0);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 850px) {

    .nav {
        height: 72px;

        padding: 0 6vw;
    }

    .nav-links {
        display: none;
    }

    .hero {
        min-height: 750px;

        height: 100svh;
    }

    .hero-content {
        left: 6vw;
        bottom: 8vh;
    }

    .hero-title {
        font-size: clamp(
            4rem,
            17vw,
            7rem
        );
    }

    .hero-meta {
        display: block;

        width: auto;

        margin-top: 40px;
    }

    .hero-description {
        max-width: 390px;

        margin-bottom: 30px;
    }

    .hero-scroll {
        display: none;
    }

    .statement,
    .practice,
    .approach,
    .why,
    .insights {
        padding: 12vh 6vw;
    }

    .statement-grid {
        grid-template-columns: 1fr;

        gap: 55px;
    }

    .dark-grid {
        grid-template-columns: 1fr;

        gap: 50px;
    }

    .practice-head,
    .approach-header,
    .insights-head {
        display: block;

        margin-bottom: 60px;
    }

    .practice-head p,
    .approach-header p,
    .insights-head p {
        margin-top: 30px;
    }

    .practice-item {
        min-height: 110px;

        grid-template-columns:
            40px
            1fr
            45px;
    }

    .practice-item:hover {
        padding-left: 10px;
        padding-right: 10px;
    }

    .practice-name {
        font-size: 1.55rem;
    }

    .visual {
        min-height: 700px;

        height: 85vh;
    }

    .visual-content {
        padding: 0 6vw 8vh;
    }

    .visual-title {
        font-size: clamp(
            3.5rem,
            14vw,
            6rem
        );
    }

    .visual-bottom {
        display: block;
    }

    .visu
