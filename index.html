<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Musamali & Associates Advocates — Legal representation, strategic advocacy and practical legal solutions in Kenya.">

<title>Musamali & Associates Advocates</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet">

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root {
    --bg: #f5f4f0;
    --surface: #e9e7e0;
    --text: #111111;
    --muted: #68655f;
    --line: rgba(17,17,17,.13);

    --dark: #101010;
    --white: #ffffff;

    --serif: "Playfair Display", Georgia, serif;
    --sans: "DM Sans", Arial, sans-serif;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

::selection {
    background: #111;
    color: #fff;
}


/* =========================================================
   LOADER
========================================================= */

.loader {
    position: fixed;
    inset: 0;

    background: #101010;
    color: white;

    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

.loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-inner {
    text-align: center;
}

.loader-mark {
    font-family: var(--serif);
    font-size: 4rem;
    line-height: 1;

    margin-bottom: 25px;
}

.loader-line {
    width: 150px;
    height: 1px;

    background: rgba(255,255,255,.25);

    overflow: hidden;
}

.loader-line span {
    display: block;

    width: 0;
    height: 100%;

    background: white;

    animation: loaderProgress 1.4s ease forwards;
}

@keyframes loaderProgress {
    to {
        width: 100%;
    }
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 88px;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5vw;

    color: white;

    transition:
        height .45s ease,
        background .45s ease,
        color .45s ease,
        border .45s ease;
}

.nav.scrolled {
    height: 70px;

    color: #111;

    background: rgba(245,244,240,.90);

    backdrop-filter: blur(18px);

    border-bottom: 1px solid var(--line);
}

.logo {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo-symbol {
    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border: 1px solid currentColor;

    font-family: var(--serif);
    font-size: 17px;
}

.logo-text {
    font-size: 11px;
    font-weight: 600;

    letter-spacing: .08em;

    text-transform: uppercase;

    line-height: 1.35;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 34px;
}

.nav-links a {
    position: relative;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .1em;
}

.nav-links a:not(.nav-cta)::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -8px;

    width: 0;
    height: 1px;

    background: currentColor;

    transition: width .3s ease;
}

.nav-links a:not(.nav-cta):hover::after {
    width: 100%;
}

.nav-cta {
    padding: 12px 20px;

    border: 1px solid currentColor;

    transition: .3s ease;
}

.nav-cta:hover {
    background: white;
    color: #111;
}

.nav.scrolled .nav-cta:hover {
    background: #111;
    color: white;
}

.menu {
    display: none;

    border: none;
    background: none;

    color: inherit;

    cursor: pointer;

    font-size: 25px;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    min-height: 100vh;

    display: flex;
    align-items: flex-end;

    color: white;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.78),
            rgba(0,0,0,.28)
        ),
        url("https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=2200&q=90")
        center / cover;
}

.hero::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.65),
            transparent 60%
        );

    pointer-events: none;
}

.hero-content {
    position: relative;

    z-index: 2;

    width: 100%;

    padding:
        0
        7vw
        9vh;
}

.eyebrow {
    display: flex;
    align-items: center;

    gap: 14px;

    margin-bottom: 28px;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .2em;

    opacity: .75;
}

.eyebrow::before {
    content: "";

    width: 48px;
    height: 1px;

    background: currentColor;
}

.hero h1 {
    max-width: 1150px;

    font-family: var(--serif);

    font-size: clamp(
        4.2rem,
        9vw,
        9.5rem
    );

    font-weight: 400;

    line-height: .86;

    letter-spacing: -.06em;
}

.hero h1 span {
    display: block;
}

.hero-bottom {
    max-width: 1150px;

    margin-top: 55px;

    display: flex;

    align-items: flex-end;

    justify-content: space-between;
}

.hero-description {
    max-width: 440px;

    font-size: 14px;

    line-height: 1.75;

    color: rgba(255,255,255,.73);
}

.hero-link {
    display: inline-flex;

    align-items: center;

    gap: 15px;

    padding-bottom: 12px;

    border-bottom: 1px solid rgba(255,255,255,.5);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .14em;
}

.hero-link .arrow {
    font-size: 18px;

    transition: transform .3s ease;
}

.hero-link:hover .arrow {
    transform: translateX(7px);
}

.scroll-indicator {
    position: absolute;

    right: 5vw;
    bottom: 8vh;

    z-index: 3;

    writing-mode: vertical-rl;

    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .2em;

    opacity: .55;
}


/* =========================================================
   INTRO
========================================================= */

.intro {
    padding: 17vh 7vw;

    display: grid;

    grid-template-columns:
        1fr
        1.35fr;

    gap: 10vw;
}

.section-number {
    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .16em;

    color: var(--muted);
}

.intro h2 {
    font-family: var(--serif);

    font-size: clamp(
        2.8rem,
        5vw,
        5.5rem
    );

    font-weight: 400;

    line-height: .98;

    letter-spacing: -.045em;
}

.intro h2 em {
    color: #85827c;
}

.intro-copy {
    max-width: 650px;

    padding-top: 10px;
}

.intro-copy p {
    font-size: clamp(
        1.1rem,
        1.6vw,
        1.45rem
    );

    line-height: 1.65;

    color: #44413d;
}

.intro-copy p + p {
    margin-top: 28px;
}


/* =========================================================
   VALUES
========================================================= */

.values {
    background: #111;

    color: white;

    padding: 9vh 7vw;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);
}

.value {
    padding: 35px 5vw;

    border-left:
        1px solid rgba(255,255,255,.15);
}

.value:first-child {
    border-left: none;
}

.value-number {
    font-family: var(--serif);

    font-size: clamp(
        3.5rem,
        6vw,
        6.5rem
    );

    font-weight: 400;

    line-height: 1;
}

.value-label {
    margin-top: 20px;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .15em;

    color: rgba(255,255,255,.55);
}


/* =========================================================
   PRACTICE AREAS
========================================================= */

.practice {
    padding: 17vh 7vw;
}

.practice-header {
    display: flex;

    justify-content: space-between;

    align-items: flex-end;

    margin-bottom: 80px;
}

.practice-header h2 {
    font-family: var(--serif);

    font-size: clamp(
        3rem,
        6vw,
        7rem
    );

    font-weight: 400;

    line-height: .88;

    letter-spacing: -.055em;
}

.practice-header p {
    max-width: 310px;

    font-size: 13px;

    line-height: 1.7;

    color: var(--muted);
}

.practice-list {
    border-top: 1px solid var(--line);
}

.practice-item {
    min-height: 125px;

    display: grid;

    grid-template-columns:
        80px
        1fr
        40px;

    align-items: center;

    border-bottom: 1px solid var(--line);

    transition:
        padding .4s ease,
        background .4s ease;
}

.practice-item:hover {
    padding: 0 25px;

    background: var(--surface);
}

.practice-num {
    font-size: 10px;

    color: var(--muted);
}

.practice-name {
    font-family: var(--serif);

    font-size: clamp(
        1.7rem,
        3vw,
        3rem
    );

    font-weight: 400;
}

.practice-arrow {
    font-size: 23px;

    transition: transform .3s ease;
}

.practice-item:hover .practice-arrow {
    transform: translateX(7px);
}


/* =========================================================
   IMAGE STATEMENT
========================================================= */

.image-break {
    min-height: 75vh;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,.30),
            rgba(0,0,0,.52)
        ),
        url("https://images.unsplash.com/photo-1589994965851-a8f479c573a9?auto=format&fit=crop&w=2200&q=90")
        center / cover fixed;
}

.image-break-content {
    max-width: 1000px;

    padding: 30px;
}

.image-break h2 {
    font-family: var(--serif);

    font-size: clamp(
        3rem,
        7vw,
        7.5rem
    );

    font-weight: 400;

    line-height: .9;

    letter-spacing: -.055em;
}

.image-break p {
    margin-top: 35px;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .15em;

    opacity: .7;
}


/* =========================================================
   APPROACH
========================================================= */

.approach {
    padding: 17vh 7vw;

    background: var(--surface);
}

.approach-grid {
    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 10vw;
}

.approach h2 {
    margin-top: 30px;

    font-family: var(--serif);

    font-size: clamp(
        3rem,
        6vw,
        6.5rem
    );

    font-weight: 400;

    line-height: .88;

    letter-spacing: -.055em;
}

.approach-copy {
    padding-top: 8px;
}

.approach-copy > p {
    font-size: 1.2rem;

    line-height: 1.7;

    margin-bottom: 60px;
}

.approach-point {
    display: grid;

    grid-template-columns:
        55px
        1fr;

    padding: 25px 0;

    border-top: 1px solid var(--line);
}

.approach-point span {
    font-size: 10px;

    color: var(--muted);
}

.approach-point h3 {
    margin-bottom: 8px;

    font-size: 16px;

    font-weight: 600;
}

.approach-point p {
    font-size: 13px;

    line-height: 1.65;

    color: var(--muted);
}


/* =========================================================
   TRACK RECORD
========================================================= */

.track {
    padding: 17vh 7vw;
}

.track-top {
    display: flex;

    align-items: flex-end;

    justify-content: space-between;

    margin-bottom: 90px;
}

.track h2 {
    font-family: var(--serif);

    font-size: clamp(
        3rem,
        6vw,
        6.5rem
    );

    font-weight: 400;

    line-height: .88;

    letter-spacing: -.055em;
}

.track-intro {
    max-width: 350px;

    font-size: 13px;

    line-height: 1.7;

    color: var(--muted);
}

.track-item {
    display: grid;

    grid-template-columns:
        100px
        1fr
        200px;

    gap: 30px;

    padding: 30px 0;

    border-top: 1px solid var(--line);

    align-items: start;
}

.track-item:last-child {
    border-bottom: 1px solid var(--line);
}

.track-year {
    font-size: 10px;

    color: var(--muted);
}

.track-title {
    font-family: var(--serif);

    font-size: 1.8rem;
}

.track-desc {
    font-size: 12px;

    line-height: 1.6;

    color: var(--muted);
}


/* =========================================================
   CONTACT CTA
========================================================= */

.cta {
    min-height: 80vh;

    padding: 12vh 7vw;

    background: #111;

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}

.cta-top {
    display: flex;

    justify-content: space-between;
}

.cta-label {
    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .18em;

    opacity: .5;
}

.cta h2 {
    max-width: 1100px;

    font-family: var(--serif);

    font-size: clamp(
        4rem,
        9vw,
        10rem
    );

    font-weight: 400;

    line-height: .86;

    letter-spacing: -.06em;
}

.cta h2 em {
    color: #777;
}

.cta-bottom {
    display: flex;

    align-items: flex-end;

    justify-content: space-between;
}

.cta-button {
    display: inline-flex;

    align-items: center;

    gap: 25px;

    padding: 20px 28px;

    border: 1px solid rgba(255,255,255,.35);

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .14em;

    transition: .35s ease;
}

.cta-button:hover {
    background: white;

    color: #111;
}

.cta-contact {
    text-align: right;

    font-size: 12px;

    line-height: 1.8;

    color: rgba(255,255,255,.55);
}

.phone {
    color: white;

    display: inline-block;

    margin-top: 3px;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    padding: 35px 7vw;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #111;

    color: white;

    border-top:
        1px solid rgba(255,255,255,.1);
}

.footer-logo {
    font-family: var(--serif);

    font-size: 20px;
}

footer p {
    font-size: 9px;

    text-transform: uppercase;

    letter-spacing: .12em;

    color: rgba(255,255,255,.4);
}


/* =========================================================
   SCROLL REVEAL
========================================================= */

.reveal {
    opacity: 0;

    transform: translateY(45px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.reveal.visible {
    opacity: 1;

    transform: translateY(0);
}


/* =========================================================
   MOBILE NAV
========================================================= */

.mobile-menu {
    position: fixed;

    inset: 0;

    z-index: 900;

    background: #111;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    visibility: hidden;

    transition: .4s ease;
}

.mobile-menu.open {
    opacity: 1;

    visibility: visible;
}

.mobile-menu-inner {
    width: 80%;
}

.mobile-menu a {
    display: block;

    padding: 18px 0;

    border-bottom:
        1px solid rgba(255,255,255,.15);

    font-family: var(--serif);

    font-size: 2.4rem;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .nav {
        height: 72px;

        padding: 0 6vw;
    }

    .nav-links {
        display: none;
    }

    .menu {
        display: block;
    }

    .hero {
        min-height: 92vh;

        background-attachment: scroll;
    }

    .hero-content {
        padding:
            0
            6vw
            9vh;
    }

    .hero h1 {
        font-size: clamp(
            3.7rem,
            16vw,
            6.5rem
        );
    }

    .hero-bottom {
        display: block;

        margin-top: 38px;
    }

    .hero-description {
        font-size: 14px;

        margin-bottom: 30px;
    }

    .scroll-indicator {
        display: none;
    }

    .intro {
        padding: 13vh 6vw;

        display: block;
    }

    .intro-copy {
        margin-top: 40px;
    }

    .values {
        grid-template-columns: 1fr;

        padding: 6vh 6vw;
    }

    .value,
    .value:first-child {
        padding: 35px 0;

        border-left: none;

        border-bottom:
            1px solid rgba(255,255,255,.15);
    }

    .value:last-child {
        border-bottom: none;
    }

    .practice,
    .track,
    .approach {
        padding: 13vh 6vw;
    }

    .practice-header,
    .track-top {
        display: block;

        margin-bottom: 55px;
    }

    .practice-header p,
    .track-intro {
        margin-top: 30px;
    }

    .practice-item {
        grid-template-columns:
            40px
            1fr
            25px;

        min-height: 105px;
    }

    .practice-item:hover {
        padding: 0 10px;
    }

    .practice-name {
        font-size: 1.5rem;
    }

    .image-break {
        min-height: 65vh;

        background-attachment: scroll;
    }

    .approach-grid {
        grid-template-columns: 1fr;

        gap: 60px;
    }

    .track-item {
        grid-template-columns:
            55px
            1fr;

        gap: 15px;
    }

    .track-desc {
        grid-column: 2;
    }

    .cta {
        min-height: 75vh;

        padding: 10vh 6vw;
    }

    .cta h2 {
        font-size: clamp(
            4rem,
            17vw,
            7rem
        );
    }

    .cta-bottom {
        display: block;
    }

    .cta-contact {
        text-align: left;

        margin-top: 35px;
    }

    footer {
        display: block;

        padding: 30px 6vw;
    }

    footer p {
        margin-top: 15px;
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 430px) {

    .logo-text {
        font-size: 9px;
    }

    .logo-symbol {
        width: 34px;
        height: 34px;
    }

    .hero h1 {
        font-size: 3.8rem;
    }

    .practice-name {
        font-size: 1.35rem;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     LOADER
======================================================== -->

<div class="loader" id="loader">

    <div class="loader-inner">

        <div class="loader-mark">
            M&A
        </div>

        <div class="loader-line">
            <span></span>
        </div>

    </div>

</div>


<!-- =======================================================
     NAVIGATION
======================================================== -->

<nav class="nav" id="nav">

    <a href="#top" class="logo">

        <div class="logo-symbol">
            M&A
        </div>

        <div class="logo-text">
            Musamali & Associates<br>
            Advocates
        </div>

    </a>


    <div class="nav-links">

        <a href="#firm">
            The Firm
        </a>

        <a href="#practice">
            Practice
        </a>

        <a href="#approach">
            Approach
        </a>

        <a href="#contact" class="nav-cta">
            Contact
        </a>

    </div>


    <button
        class="menu"
        i
